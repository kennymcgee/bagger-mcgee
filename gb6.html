<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagger McGee - Design Standards Guidebook</title>
</head>
<body>
<p style="font-family:sans-serif;padding:40px">Loading preview...</p>
<script>
(async function(){
  try {
    var B='https://raw.githubusercontent.com/kennymcgee/bagger-mcgee/main/preview/gb6/';
    var parts=await Promise.all([1,2,3].map(function(n){
      return fetch(B+'c'+n+'.b64', {cache:'no-store'}).then(function(r){return r.text()});
    }));
    var c1=parts[0], c2=parts[1], c3=parts[2];
    c2=c2.replace(/[\s]+/g,'');
    c2=c2.slice(0,5728)+'T'+c2.slice(5728,6152)+'K'+c2.slice(6152);
    var t=c1+c2+c3;
    var bin=Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)});
    var txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();document.write(txt);document.close();
  } catch(e) {
    document.body.innerHTML='<p style="font-family:sans-serif;padding:40px">Preview failed to load: '+e+'</p>';
  }
})();
</script>
</body>
</html>
