<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bagger McGee - Brand Standards</title>
<style>html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#31415A;color:#f4ede1;font-family:Georgia,serif;font-size:18px;text-align:center;padding:20px;box-sizing:border-box}</style>
</head><body><div id="s">Loading preview&hellip;</div>
<script>
(async function(){
  var N=14, base='https://kennymcgee.github.io/bagger-mcgee/preview/gb6/r9/';
  try{
    var parts=[];
    for(var i=1;i<=N;i++){
      var r=await fetch(base+'c'+i+'.b64',{cache:'no-store'});
      if(!r.ok)throw new Error('chunk '+i+' http '+r.status);
      parts.push((await r.text()).trim());
    }
    var b64=parts.join('').replace(/=/g,'');
    b64+='='.repeat((-b64.length%4));
    var bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(var j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
    var out=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if(out.length!==261293)throw new Error('length '+out.length+' expected 261293');
    document.open();document.write(out);document.close();
  }catch(e){
    document.getElementById('s').textContent='Preview failed to load ('+e.message+'). Tap to retry.';
    document.body.onclick=function(){location.reload()};
  }
})();
</script></body></html>
