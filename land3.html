<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bagger McGee - Landing 3.0</title>
<style>html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#31415A;color:#f4ede1;font-family:Georgia,serif;font-size:18px;text-align:center;padding:20px;box-sizing:border-box}</style>
</head><body><div id="s">Loading preview&hellip;</div>
<script>
(async function(){
  try{
    var page=await (await fetch('https://raw.githubusercontent.com/kennymcgee/bagger-mcgee/main/bagger-mcgee-landing.html',{cache:'no-store'})).text();
    var names=["p1", "p2"],parts=[];
    for(var i=0;i<names.length;i++){
      var r=await fetch('https://kennymcgee.github.io/bagger-mcgee/preview/land3/r1/'+names[i]+'.b64',{cache:'no-store'});
      if(!r.ok)throw new Error(names[i]+' http '+r.status);
      parts.push((await r.text()).trim());
    }
    var b64=parts.join('').replace(/=/g,'');
    b64+='='.repeat((4-b64.length%4)%4);
    var bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(var j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
    var css=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    var L1=17730,skin=css.slice(0,L1),l2=css.slice(L1);
    if(skin.indexOf('--slate-deep:#2A3B52')<0)throw new Error('skin marker missing');
    var reps=[
      ['family=Montserrat:wght@700;800&family=Inter','family=Montserrat:wght@700;800&family=Onest:wght@700;800;900&family=Inter',1],
      ['<a class="btn mold mold-circle" href="bagger-mcgee-get-listed-v6.html">','<a class="btn mold mold-circle compact-cta" href="bagger-mcgee-get-listed-v6.html">',1],
      ['<a class="mold mold-circle" href="bagger-mcgee-get-listed-v6.html">','<a class="mold mold-circle compact-cta" href="bagger-mcgee-get-listed-v6.html">',1]
    ];
    for(var q=0;q<reps.length;q++){
      var c=page.split(reps[q][0]).length-1;
      if(c!==reps[q][2])throw new Error('marker '+q+' count '+c);
      page=page.split(reps[q][0]).join(reps[q][1]);
    }
    var c2=page.split('background:var(--navy)"></i>').length-1;
    if(c2!==3)throw new Error('bars count '+c2);
    page=page.split('background:var(--navy)"></i>').join('background:var(--slate-light)"></i>');
    var layer='<style>\n'+skin+'\n</style>\n<style>\n'+l2+'\n</style>\n</head>';
    if(page.split('</head>').length!==2)throw new Error('head count');
    page=page.replace('</head>',layer);
    if(page.length!==210834)throw new Error('length '+page.length+' expected 210834');
    document.open();document.write(page);document.close();
  }catch(e){
    document.getElementById('s').textContent='Preview failed to load ('+e.message+'). Tap to retry.';
    document.body.onclick=function(){location.reload()};
  }
})();
</script></body></html>
